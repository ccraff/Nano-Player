<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6fd8"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><title>Nano</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#000;font:20px/1.2 sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;height:100%;margin:auto;display:flex;flex-direction:column;background:#fff}
#bar{flex:none;height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(#f7f7f8,#b4b8c0);border-bottom:1px solid #7a7e86;font-weight:700}
#bar b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#bat{font-size:15px}
#bar.dark{background:linear-gradient(#4a4a4c,#1b1b1c);color:#fff;border:0}#bar.dark b{text-align:center}
#list{flex:1;overflow-y:auto}
.row{height:64px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #e2e2e2}
.row div{flex:1;min-width:0}.row span,.row small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.row small{font-size:15px;opacity:.6}
.row.sel{background:linear-gradient(#5bb0ff,#1f6fd8);color:#fff;border:0}
#np{display:none;flex:1;flex-direction:column;background:#000;color:#fff;min-height:0}
#info{height:62px;text-align:center;line-height:1.1;display:flex;flex-direction:column;justify-content:center;padding:0 10px;background:linear-gradient(#1b1b1c,#0b0b0c)}
#info>*{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#info i{font-style:normal;font-size:14px;color:#b5b8bf}#info b{font-size:18px}
#art{flex:1;min-height:0;display:flex;justify-content:center}#art img{max-width:100%;max-height:100%;object-fit:contain}
#prog{flex:none;height:62px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:15px;font-weight:700}
#trk{flex:1;height:9px;background:#e8e8e8;border-radius:5px;overflow:hidden}#fill{height:100%;width:0;background:linear-gradient(#5bb0ff,#1f6fd8)}
#cf{display:none;position:fixed;top:0;left:0;width:100vh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);background:linear-gradient(#fff,#e4e6ea);overflow:hidden;color:#222;z-index:5}
#stage{position:absolute;inset:0;perspective:900px;perspective-origin:50% 40%}
.cv{position:absolute;top:calc(50% - var(--cs)*.72);left:calc(50% - var(--cs)/2);width:var(--cs);height:var(--cs);transition:transform .35s ease;background:#888 center/cover;border:1px solid #0002;-webkit-box-reflect:below 2px linear-gradient(transparent 62%,rgba(255,255,255,.45))}
#cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;line-height:1.25}#cap b{font-size:22px}#cap small{font-size:17px;color:#666}
#pan{display:none;position:absolute;inset:0;background:#0006;align-items:center;justify-content:center;z-index:9}
#pb{width:58%;height:80%;background:#fff;border:1px solid #0006;border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
#ph{flex:none;height:54px;background:linear-gradient(#5bb0ff,#1f6fd8);color:#fff;padding:6px 12px;line-height:1.25;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#ph small{font-size:13px;opacity:.8}
#pl{flex:1;overflow-y:auto}.pr{height:40px;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:0 12px;font-size:16px;border-bottom:1px solid #e2e2e2}
.pr span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.pr.sel{background:linear-gradient(#5bb0ff,#1f6fd8);color:#fff}
#msg{position:fixed;left:30px;right:30px;bottom:20px;background:#000c;color:#fff;padding:10px;border-radius:10px;text-align:center;display:none;font-size:16px}
</style></head><body>
<div id=app><div id=bar><b id=ttl>Nano</b><span id=pp></span><span id=bat></span></div>
<div id=list></div>
<div id=np><div id=info></div><div id=art></div><div id=prog><span id=t0>0:00</span><div id=trk><div id=fill></div></div><span id=t1>-0:00</span></div></div></div>
<div id=cf><div id=stage></div><div id=cap></div><div id=pan><div id=pb><div id=ph></div><div id=pl></div></div></div></div>
<div id=msg></div>
<script>
const CID='948f23933e524de3a79201c87a1a8469',LS=localStorage,$=i=>document.getElementById(i);
const REDIR=location.origin+location.pathname.replace(/index\.html$/,'');
const SC='streaming user-read-email user-read-private playlist-read-private playlist-read-collaborative user-read-playback-state user-modify-playback-state';
let player,dev,st=null,stack=[],vol=.8,posAt=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const mmss=ms=>{ms=Math.max(0,ms|0);const s=Math.round(ms/1000);return(s/60|0)+':'+String(s%60).padStart(2,'0')};
const clock=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
let tt;function toast(m){const e=$('msg');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2500)}
// ---- Spotify (PKCE) ----
async function login(){const v=b64(crypto.getRandomValues(new Uint8Array(48)));LS.verifier=v;
 const c=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
 location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CID,response_type:'code',redirect_uri:REDIR,scope:SC,code_challenge_method:'S256',code_challenge:c})}
async function tokReq(p){const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(p)});
 const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.error);LS.access=j.access_token;if(j.refresh_token)LS.refresh=j.refresh_token;LS.exp=Date.now()+j.expires_in*1000-6e4;return j.access_token}
const token=async()=>LS.access&&Date.now()<+LS.exp?LS.access:tokReq({client_id:CID,grant_type:'refresh_token',refresh_token:LS.refresh});
async function api(p,o={}){const r=await fetch('https://api.spotify.com/v1'+p,{...o,headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'}});
 if(r.status==204)return null;const t=await r.text();if(!r.ok)throw new Error(r.status+' '+t.slice(0,120));return t?JSON.parse(t):null}
// ---- pantallas ----
const cur=()=>stack[stack.length-1];
function push(s){stack.push(s);draw()}function pop(){if(stack.length>1){stack.pop();draw()}}
function draw(){const s=cur();$('cf').style.display=s.cf?'block':'none';if(s.cf){cfDraw();return}$('np').style.display=s.np?'flex':'none';$('list').style.display=s.np?'none':'block';$('bar').className=s.np?'dark':'';
 $('ttl').textContent=s.np?clock():s.title;
 if(!s.np){$('list').innerHTML=s.items.map((it,i)=>`<div class="row${i==s.sel?' sel':''}" data-i="${i}"><div><span>${esc(it.l)}</span>${it.s?`<small>${esc(it.s)}</small>`:''}</div></div>`).join('');
  const e=$('list').children[s.sel];e&&e.scrollIntoView({block:'nearest'})}icon()}
const icon=()=>$('pp').textContent=st?(st.paused?'⏸':'▶'):'';
const act=()=>{const it=cur().items?.[cur().sel];it&&it.go&&it.go()};
const home=()=>({title:'Nano',sel:0,items:[{l:'Cover Flow',go:albums},{l:'Playlists',go:playlists},{l:'Reproduciendo',go:()=>st?push({np:1}):toast('Nada reproduciéndose')},{l:'Cerrar sesión',go:()=>{LS.clear();location.reload()}}]});
async function playlists(){try{toast('Cargando…');const j=await api('/me/playlists?limit=50');
 push({title:'Playlists',sel:0,items:j.items.filter(Boolean).map(p=>({l:p.name,s:(p.items?.total??p.tracks?.total??'')!==''?(p.items?.total??p.tracks?.total)+' canciones':'',go:()=>tracks(p)}))})}catch(e){toast(e.message)}}
async function tracks(p){toast('Cargando…');let j={items:[]};
 try{j=await api(`/playlists/${p.id}/items?limit=100`)}catch(e){try{j=await api(`/playlists/${p.id}/tracks?limit=100`)}catch(e2){}}
 const ts=(j.items||[]).map(x=>x.track||x.item).filter(t=>t&&t.uri).map(t=>({l:t.name,s:(t.artists||[]).map(a=>a.name).join(', '),go:()=>play({context_uri:p.uri,offset:{uri:t.uri}})}));
 push({title:p.name,sel:0,items:[{l:'▶ Reproducir todo',go:()=>play({context_uri:p.uri})},...ts]})}
async function play(body){if(!dev)return toast('El reproductor aún no está listo');player.activateElement();
 try{await api('/me/player/play?device_id='+dev,{method:'PUT',body:JSON.stringify(body)});if(!cur().np)push({np:1})}catch(e){toast('Error: '+e.message)}}
async function albums(){toast('Cargando…');let a=[];
 try{a=(await api('/me/albums?limit=50')).items.map(x=>x.album).filter(Boolean)}catch(e){}
 if(!a.length){try{a=(await api('/me/playlists?limit=50')).items.filter(Boolean).map(p=>({...p,artists:[{name:p.owner?.display_name||''}],isPl:1}))}catch(e){return toast(e.message)}}
 push({cf:1,albums:a,idx:0,panel:null})}
async function getTracks(a){let j;
 if(!a.isPl){try{return(await api(`/albums/${a.id}/tracks?limit=50`)).items.map(t=>({n:t.name,u:t.uri,ms:t.duration_ms}))}catch(e){return[]}}
 try{j=await api(`/playlists/${a.id}/items?limit=100`)}catch(e){try{j=await api(`/playlists/${a.id}/tracks?limit=100`)}catch(e2){j={items:[]}}}
 return j.items.map(x=>x.track||x.item).filter(t=>t&&t.uri).map(t=>({n:t.name,u:t.uri,ms:t.duration_ms}))}
async function openAlbum(s){const a=s.albums[s.idx];if(!a)return;toast('Cargando…');s.panel={a,t:await getTracks(a),sel:0};draw()}
function playT(s){const p=s.panel,t=p.t[p.sel];play(t?{context_uri:p.a.uri,offset:{uri:t.u}}:{context_uri:p.a.uri})}
function cfDraw(){const s=cur(),W=$('cf').clientWidth,H=$('cf').clientHeight,cs=Math.min(H*.52,W*.42),g=$('stage');
 if(g.dataset.k!=s.albums.length+s.albums[0]?.id){g.innerHTML=s.albums.map((a,i)=>`<div class="cv" data-i="${i}" style="background-image:url('${a.images?.[0]?.url||''}')"></div>`).join('');g.dataset.k=s.albums.length+s.albums[0]?.id}
 [...g.children].forEach((el,i)=>{const d=i-s.idx,ad=Math.abs(d);if(ad>6){el.style.display='none';return}el.style.display='';el.style.setProperty('--cs',cs+'px');
  const t=Math.max(-1,Math.min(1,d)),x=ad<1?d*cs*.78:Math.sign(d)*(cs*.78+(ad-1)*cs*.3);
  el.style.transform=`translateX(${x}px) rotateY(${-t*65}deg) scale(${1-.18*Math.abs(t)})`;el.style.zIndex=100-Math.round(ad*10)});
 const a=s.albums[s.idx];$('cap').innerHTML=a?`<b>${esc(a.name)}</b><br><small>${esc((a.artists||[]).map(x=>x.name).join(', '))}</small>`:'Sin álbumes';
 const p=s.panel;$('pan').style.display=p?'flex':'none';
 if(p){$('ph').innerHTML=`<b>${esc(p.a.name)}</b><br><small>${esc((p.a.artists||[]).map(x=>x.name).join(', '))}</small>`;
  $('pl').innerHTML=p.t.map((t,i)=>`<div class="pr${i==p.sel?' sel':''}" data-i="${i}"><span>${esc(t.n)}</span><span>${mmss(t.ms)}</span></div>`).join('');
  const e=$('pl').children[p.sel];e&&e.scrollIntoView({block:'nearest'})}}
let ty=0;const cf=$('cf');
cf.addEventListener('touchstart',e=>ty=e.touches[0].clientY,{passive:true});
cf.addEventListener('touchend',e=>{const s=cur();if(!s.cf||s.panel)return;const dy=e.changedTouches[0].clientY-ty;
 if(Math.abs(dy)>40){s.idx=Math.min(s.albums.length-1,Math.max(0,s.idx+(dy>0?-1:1)));draw()}},{passive:true});
cf.addEventListener('click',e=>{const s=cur();if(!s.cf)return;const r=e.target.closest('.pr'),c=e.target.closest('.cv');
 if(s.panel){if(r){s.panel.sel=+r.dataset.i;playT(s)}else if(!e.target.closest('#pb')){s.panel=null;draw()}}
 else if(c){const i=+c.dataset.i;if(i==s.idx)openAlbum(s);else{s.idx=i;draw()}}});
const toggle=()=>player&&(player.activateElement(),player.togglePlay());
function setVol(d){vol=Math.min(1,Math.max(0,vol+d));player&&player.setVolume(vol);toast('Volumen '+Math.round(vol*100)+'%')}
// ---- teclado (D-pad + numérico) y táctil ----
document.addEventListener('keydown',e=>{const k=e.key,s=cur(),up=k=='ArrowUp'||k=='2',dn=k=='ArrowDown'||k=='8',lf=k=='ArrowLeft'||k=='4',rt=k=='ArrowRight'||k=='6',
 ok=k=='Enter'||k=='5',bk=['Escape','Backspace','ContextMenu','GoBack','SoftLeft'].includes(k);let h=true;
 if(k=='0')toggle();else if(k=='*'){stack=[home()];draw()}else if(k=='#'){st&&!s.np&&push({np:1})}
 else if(s.cf){const p=s.panel,n=lf||up?-1:rt||dn?1:0;
  if(p){if(n){p.sel=Math.min(p.t.length-1,Math.max(0,p.sel+n));draw()}else if(ok)playT(s);else if(bk){s.panel=null;draw()}else h=false}
  else{if(n){s.idx=Math.min(s.albums.length-1,Math.max(0,s.idx+n));draw()}else if(ok)openAlbum(s);else if(bk)pop();else h=false}}
 else if(s.np){if(lf)player.previousTrack();else if(rt)player.nextTrack();else if(up)setVol(.1);else if(dn)setVol(-.1);else if(ok)toggle();else if(bk)pop();else h=false}
 else{if(up||dn){s.sel=Math.min(s.items.length-1,Math.max(0,s.sel+(dn?1:-1)));draw()}else if(ok||rt)act();else if(lf||bk)pop();else h=false}
 if(h)e.preventDefault()});
$('list').onclick=e=>{const r=e.target.closest('.row');if(r){cur().sel=+r.dataset.i;draw();act()}};
$('art').onclick=toggle;$('ttl').onclick=()=>pop();
// ---- reproductor ----
function render(){if(!st)return;const t=st.track_window.current_track,u=t.album.images[0]?.url||'',ar=t.artists.map(a=>a.name).join(', ');
 $('info').innerHTML=`<i>${esc(ar)}</i><b>${esc(t.name)}</b><i>${esc(t.album.name)}</i>`;
 if($('art').dataset.u!=u){$('art').innerHTML=u?`<img src="${u}">`:'';$('art').dataset.u=u}
 if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:ar,album:t.album.name,artwork:u?[{src:u}]:[]});icon()}
setInterval(()=>{if(cur()?.np)$('ttl').textContent=clock();if(!st)return;const d=st.duration,p=st.paused?st.position:st.position+Date.now()-posAt;
 $('fill').style.width=Math.min(100,p/d*100)+'%';$('t0').textContent=mmss(p);$('t1').textContent='-'+mmss(d-p)},500);
function boot(){window.onSpotifyWebPlaybackSDKReady=()=>{player=new Spotify.Player({name:'Nano',getOAuthToken:async cb=>cb(await token()),volume:vol});
  ['initialization_error','authentication_error','account_error','playback_error'].forEach(ev=>player.addListener(ev,m=>toast(ev+': '+m.message)));
  player.addListener('ready',({device_id})=>{dev=device_id;toast('Listo ✔')});
  player.addListener('player_state_changed',s=>{st=s;posAt=Date.now();render()});player.connect();
  if('mediaSession' in navigator)[['play',()=>player.resume()],['pause',()=>player.pause()],['previoustrack',()=>player.previousTrack()],['nexttrack',()=>player.nextTrack()]].forEach(([a,f])=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(_){}})};
 const s=document.createElement('script');s.src='https://sdk.scdn.co/spotify-player.js';document.body.appendChild(s);stack=[home()];draw()}
navigator.getBattery?.().then(b=>{const u=()=>$('bat').textContent=Math.round(b.level*100)+'%';u();b.onlevelchange=u});
(async()=>{const q=new URLSearchParams(location.search);
 if(q.get('code')){try{await tokReq({client_id:CID,grant_type:'authorization_code',code:q.get('code'),redirect_uri:REDIR,code_verifier:LS.verifier})}catch(e){toast(e.message)}history.replaceState({},'',REDIR)}
 if(LS.refresh)boot();else{stack=[{title:'Nano',sel:0,items:[{l:'Iniciar sesión con Spotify',go:login}]}];draw()}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
